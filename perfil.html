<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Mi Perfil
    </title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #111827;
        }

        .container {
            max-width: 1400px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .profile-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
        }

        /* SIDEBAR */

        .sidebar {
            background: white;
            border-radius: 30px;
            padding: 35px;
            height: fit-content;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .06);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #6366f1;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
            margin-bottom: 25px;
            font-size: 42px;
            font-weight: bold;
        }

        .username {
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .email {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu button {
            border: none;
            padding: 16px;
            border-radius: 16px;
            cursor: pointer;
            background: #f9fafb;
            font-weight: bold;
        }

        /* MAIN */

        .main {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .card {
            background: white;
            border-radius: 30px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .06);
        }

        .card h2 {
            margin-bottom: 25px;
            font-size: 30px;
        }

        /* FORM */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group label {
            font-weight: bold;
        }

        .input-group input {
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #dbe3ee;
            background: #f9fafb;
        }

        .save-btn {
            margin-top: 25px;
            border: none;
            background: #6366f1;
            color: white;
            padding: 18px;
            border-radius: 16px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
        }

        /* FAVORITOS */

        .favorites-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .favorite-card {
            background: #f9fafb;
            border-radius: 24px;
            padding: 20px;
            text-align: center;
        }

        .favorite-card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .favorite-card h3 {
            margin-bottom: 10px;
        }

        /* PEDIDOS */

        .orders {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .order {
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 25px;
        }

        .message {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: 14px;
            background: #dcfce7;
            color: #166534;
        }

        @media(max-width:1000px) {

            .profile-layout {
                grid-template-columns: 1fr;
            }

        }

        @media(max-width:700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

        }
    </style>

</head>

<body>

    <div class="container">

        <div class="profile-layout">

            <aside class="sidebar">

                <div class="avatar" id="avatar">
                </div>

                <h2 class="username" id="sidebarUsername">
                </h2>

                <p class="email" id="sidebarEmail">
                </p>

                <div class="menu">

                    <button>
                        Mi perfil
                    </button>

                    <button>
                        Pedidos
                    </button>

                    <button>
                        Favoritos
                    </button>

                    <button id="logoutBtn">
                        Cerrar sesión
                    </button>

                </div>

            </aside>

            <main class="main">

                <section class="card">

                    <h2>Editar perfil</h2>

                    <form id="profileForm">

                        <div class="form-grid">

                            <div class="input-group">
                                <label>Nombre</label>
                                <input type="text" id="firstname">
                            </div>

                            <div class="input-group">
                                <label>Apellido</label>
                                <input type="text" id="lastname">
                            </div>

                            <div class="input-group">
                                <label>Usuario</label>
                                <input type="text" id="username">
                            </div>

                            <div class="input-group">
                                <label>Email</label>
                                <input type="email" id="email">
                            </div>

                            <div class="input-group">
                                <label>Teléfono</label>
                                <input type="text" id="phone">
                            </div>

                            <div class="input-group">
                                <label>Ciudad</label>
                                <input type="text" id="city">
                            </div>

                        </div>

                        <button class="save-btn" type="submit">
                            Guardar cambios
                        </button>

                        <div class="message" id="message">
                            Usuario actualizado correctamente
                        </div>

                    </form>

                </section>

                <section class="card">

                    <h2>Favoritos</h2>

                    <div class="favorites-grid" id="favoritesContainer"></div>

                    <button class="save-btn" id="loadMoreBtn">
                        Cargar más
                    </button>

                </section>

                <section class="card">

                    <h2>Mis pedidos</h2>

                    <div class="orders" id="ordersContainer"></div>

                </section>

            </main>

        </div>

    </div>

    <script>

        let currentUser = null;
        let allFavorites = [];
        let visibleFavorites = 4;

        async function getUser() {

            const response =
                await fetch('https://fakestoreapi.com/users/1');

            const user = await response.json();

            currentUser = user;

            renderUser(user);
        }

        function renderUser(user) {

            document.getElementById("avatar").textContent =
                user.name.firstname[0].toUpperCase();

            document.getElementById("sidebarUsername").textContent =
                user.username;

            document.getElementById("sidebarEmail").textContent =
                user.email;

            firstname.value = user.name.firstname;
            lastname.value = user.name.lastname;
            username.value = user.username;
            email.value = user.email;
            phone.value = user.phone;
            city.value = user.address.city;
        }

        async function updateUser() {

            const body = {

                email: email.value,

                username: username.value,

                phone: phone.value,

                name: {
                    firstname: firstname.value,
                    lastname: lastname.value
                }
            };

            await fetch(
                'https://fakestoreapi.com/users/1',
                {
                    method: 'PUT',
                    body: JSON.stringify(body)
                }
            );

            document.getElementById("message").style.display =
                "block";

            setTimeout(() => {

                document.getElementById("message").style.display =
                    "none";

            }, 3000);
        }

        async function getFavorites() {

            const response =
                await fetch('https://fakestoreapi.com/products');

            allFavorites = await response.json();

            renderFavorites();
        }

        function renderFavorites() {

            const container =
                document.getElementById("favoritesContainer");

            container.innerHTML = "";

            const visible =
                allFavorites.slice(0, visibleFavorites);

            visible.forEach(product => {

                container.innerHTML += `

        <div class="favorite-card">

            <img src="${product.image}">

            <h3>${product.title.slice(0, 25)}</h3>

            <p>${product.category}</p>

            <div class="price">
                ${product.price}€
            </div>

        </div>

        `;
            });
        }

        function loadMoreFavorites() {

            visibleFavorites += 4;

            renderFavorites();

            if (visibleFavorites >= allFavorites.length) {

                document.getElementById("loadMoreBtn")
                    .style.display = "none";
            }
        }

        async function getOrders() {

            const response =
                await fetch(
                    'https://fakestoreapi.com/carts/user/1'
                );

            const orders = await response.json();

            renderOrders(orders);
        }

        async function renderOrders(orders) {

            const container =
                document.getElementById("ordersContainer");

            container.innerHTML = "";

            for (const order of orders) {

                let productsHTML = "";

                for (const item of order.products) {

                    const response =
                        await fetch(
                            `https://fakestoreapi.com/products/${item.productId}`
                        );

                    const product =
                        await response.json();

                    productsHTML += `
                <div>
                    <span>
                        ${product.title.slice(0, 40)}
                    </span>

                    <strong>
                        x${item.quantity}
                    </strong>
                </div>
            `;
                }

                container.innerHTML += `

            <div class="order">

                <div class="order-header">

                    <strong>
                        Pedido #${order.id}
                    </strong>

                    <span class="order-status">
                        Entregado
                    </span>

                </div>

                <small>
                    ${order.date.slice(0, 10)}
                </small>

                <div class="order-products">
                    ${productsHTML}
                </div>

            </div>
        `;
            }
        }

        function logout() {

            alert("Sesión cerrada");

            location.reload();
        }

        function initEvents() {

            document
                .getElementById("profileForm")
                .addEventListener("submit", e => {

                    e.preventDefault();

                    updateUser();
                });

            document
                .getElementById("loadMoreBtn")
                .addEventListener("click",
                    loadMoreFavorites);

            document
                .getElementById("logoutBtn")
                .addEventListener("click",
                    logout);
        }

        function init() {

            getUser();

            getFavorites();

            getOrders();

            initEvents();
        }

        init();

    </script>

</body>

</html>
